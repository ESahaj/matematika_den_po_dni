function greekTasks(i){
 if(i<5)return lessons[i].questions;
 return Array.from({length:3},(_,j)=>{
  const triples=[[3,4,5],[5,12,13],[8,15,17]];
  const k=1+(i+j)%2,[a,b,c]=triples[(i+j)%3].map(x=>k*x);
  if(i===12){
   const longest=c+[0,1,-1][j],kind=['pravoúhlý','tupoúhlý','ostroúhlý'];
   return [`Ríša naměřil strany ${a}, ${b} a ${longest} m. Jaký je tento trojúhelník podle úhlů?`,kind,j]
  }
  const [prompt,v]=({
   5:[`Na pravoúhlém rohu nádvoří odměřil Ríša podél jedné zdi ${a} m a podél druhé ${b} m. Jak daleko jsou od sebe vyznačené body?`,c],
   6:[`Trojúhelníková mozaika má pravý úhel. Přepona měří ${c} dm a jedna odvěsna ${a} dm. Kolik decimetrů měří druhá odvěsna?`,b],
   7:[`Obdélníková mozaika měří ${a} dm × ${b} dm. Jak dlouhá je její úhlopříčka?`,c],
   8:[`Přímé schodiště stoupá do výšky ${a} m. Vodorovná vzdálenost mezi jeho konci je ${b} m. Jaká je přímá vzdálenost mezi dolním a horním koncem?`,c],
   9:[`Rovnoramenný štít chrámu má základnu ${2*a} m a ramena délky ${c} m. Jak vysoký je štít?`,b],
   10:[`Žebřík délky ${c} m se opírá o svislou zeď. Jeho pata je ${a} m od zdi. Do jaké výšky dosáhne?`,b],
   11:[`Ríša šel tržištěm ${a} m na sever a ${b} m na východ. Kolik metrů by ušetřil přímou cestou?`,a+b-c],
   13:[`Lano vede z vrcholu svislého stožáru přímo ke kolíku na rovné zemi. Stožár měří ${a} m a kolík je od paty ${b} m. Jak dlouhé je napnuté lano?`,c],
   14:[`Obdélníková brána je vysoká ${a} m a má úhlopříčku ${c} m. Jak je široká?`,b]
  })[i];
  const unit=[6,7].includes(i)?' dm':' m',answer=(i+j)%3,opts=[v,v,v];opts[(answer+1)%3]=v+2;opts[(answer+2)%3]=v+4;
  return [prompt,opts.map(x=>x+unit),answer]
 });
}

function cityTasks(id,i){
 return Array.from({length:3},(_,j)=>{
  const n=j+2,a=2*n+4,b=n+2,price=100*n;
  const percent=[20,25,40][j];
  const cases=id==='paris'?[
   [`Výlet stojí ${price} €. Kolik je 1 % z této částky?`,price/100,'€'],
   [`Batoh stojí ${30*n} €. Kolik eur je 10 % z ceny?`,3*n,'€'],
   [`V sále je ${40*n} míst. Žáci obsadili 25 % z nich. Kolik míst obsadili?`,10*n,'míst'],
   [`Procházka měří ${2*a} km. Ríša ušel 50 % trasy. Kolik kilometrů má za sebou?`,a,'km'],
   [`Cukrář upekl ${20*n} croissantů a prodal 75 % z nich. Kolik jich prodal?`,15*n,'ks'],
   [`V galerii je ${60*n} obrazů. Na výstavu zapůjčí 5 % z nich. Kolik obrazů zapůjčí?`,3*n,'obrazů'],
   [`Do Louvru přišlo ${price} lidí. Děti tvořily ${percent} %. Kolik dětí přišlo?`,n*percent,'dětí'],
   [`Kufr za ${price} € zlevnili o ${percent} %. O kolik eur se jeho cena snížila?`,n*percent,'€'],
   [`Kabát stál ${price} €. Kolik stojí po slevě ${percent} %?`,price-n*percent,'€'],
   [`Rodinná vstupenka stála ${20*n} €. Její cena se zvýšila o 10 %. Kolik stojí nyní?`,22*n,'€'],
   [`Z ${price} pohlednic se prodalo ${n*percent}. Kolik procent se prodalo?`,percent,'%'],
   [`Na výletní lodi na Seině pro ${price} lidí je ${n*percent} volných míst. Kolik procent míst je obsazeno?`,100-percent,'%'],
   [`Po slevě 20 % stojí taška ${16*n} €. Jaká byla původní cena?`,20*n,'€'],
   [`Obchod zlevnil kolo z ${price} € o 10 %. Pak snížil novou cenu ještě o 10 %. Kolik kolo stojí?`,81*n,'€'],
   [`Z rozpočtu ${price} € dal Ríša 25 % na jízdenky a 15 % původního rozpočtu na jídlo. Kolik mu zbývá?`,60*n,'€']
  ]:[
   [`Čtvercové nádvoří má stranu ${a} m. Jaký má obvod?`,4*a,'m'],
   [`Čtvercová mozaika v římských lázních má stranu ${b} dm. Jaký má obsah?`,b*b,'dm²'],
   [`Obdélníkový záhon měří ${a} m na délku a ${b} m na šířku. Jaký má obvod?`,2*(a+b),'m'],
   [`Obdélníkový stánek na římském tržišti má rozměry ${a} m a ${b} m. Jakou plochu zabírá?`,a*b,'m²'],
   [`Obvod čtvercového altánu je ${4*a} m. Jak dlouhá je jedna strana?`,a,'m'],
   [`Čtvercová podlaha má obsah ${a*a} m². Jak dlouhá je její strana?`,a,'m'],
   [`Obdélníkový dvůr má obvod ${2*(a+b)} m. Jedna strana měří ${a} m. Kolik měří sousední strana?`,b,'m'],
   [`Strany trojúhelníkové zahrady měří ${3*n} m, ${4*n} m a ${5*n} m. Jaký má obvod?`,12*n,'m'],
   [`Trojúhelníkový štít má základnu ${a} m a výšku k této základně ${b} m. Jaký má obsah?`,a*b/2,'m²'],
   [`Mozaika ve tvaru rovnoběžníku má základnu ${a} dm a příslušnou výšku ${b} dm. Jaký má obsah?`,a*b,'dm²'],
   [`Rovnoběžné strany lichoběžníkového záhonu měří ${a} m a ${a+4} m. Jejich vzdálenost je ${b} m. Jaký má záhon obsah?`,(a+2)*b,'m²'],
   [`Vedle čtvercového dvora o straně ${b} m leží obdélníkový dvůr o rozměrech ${a} m × ${b} m. Jaká je jejich celková plocha?`,b*b+a*b,'m²'],
   [`Uprostřed čtvercového záhonu o straně ${a} m stojí čtvercová kašna o straně ${b} m. Kolik plochy zbývá pro květiny?`,a*a-b*b,'m²'],
   [`Obdélníková zahrada měří ${a} m × ${b} m. Kolem zahrady má vést zeď s otvorem širokým 2 m pro branku. Kolik metrů zdi se postaví?`,2*(a+b)-2,'m'],
   [`Podlaha měří ${a} m × ${b} m. Kolik čtvercových dlaždic o straně 50 cm ji pokryje beze spár?`,4*a*b,'ks']
  ];
  const [prompt,value,unit]=cases[i],answer=(i+j)%3,delta=Math.max(1,Math.round(value/5));
  const choices=[value,value,value];choices[(answer+1)%3]=value+delta;choices[(answer+2)%3]=value-delta;
  return [prompt,choices.map(v=>v+' '+unit),answer];
 });
}

function dailyBlock(id,i){return dailySets[id][Math.floor(i/3)]}
function topic(id,i){
 const block=dailyBlock(id,i);
 return (i%3)*3<block.questions.length?block.title:practiceTopic(id,i);
}
function tasks(id,i){
 const block=dailyBlock(id,i),offset=(i%3)*3,extras=practiceTasks(id,i);
 return Array.from({length:3},(_,j)=>block.questions[offset+j]||extras[j]);
}

function openPick(){
 pickOpen=true;question=correct=0;questions=pickQuestions;$('stageTitle').textContent='Vídeň · Georg Pick';
 renderQuestion();if(!$('quiz').open)$('quiz').showModal();
}
function renderPracticeQuestion(){
  const [prompt,options,answer,showTriangle] = questions[question];
  const area = $('questionArea');
  area.innerHTML = '<p>Úloha '+(question+1)+' ze 3</p><p><strong>'+prompt+'</strong></p>' + (showTriangle ? triangle : '') + '<div class="options" role="group" aria-label="Možnosti"></div><button class="action" id="continue" disabled>'+(question === 2 ? 'Zjistit výsledek' : 'Další úloha')+'</button>';
  let selected = -1;
  const group = area.querySelector('.options');
  options.forEach((option,i) => {
    const button = document.createElement('button');
    button.className = 'option';
    button.textContent = option;
    button.setAttribute('aria-pressed','false');
    button.onclick = () => {
      selected = i;
      for (const item of group.children) item.setAttribute('aria-pressed',String(item === button));
      $('continue').disabled = false;
    };
    group.append(button);
  });
  $('continue').onclick = () => {
    if (selected === answer) correct++;
    question++;
    if (question < 3) {
      renderQuestion();
      $('questionArea').querySelector('.option').focus();
    } else showResult();
  };
}

function gridShape(question) {
  const {rows = 10, columns = 10} = question.grid;
  if (!Number.isInteger(rows) || !Number.isInteger(columns) || rows < 1 || columns < 1 || rows * columns > 100) {
    return {columns:10,total:100};
  }
  return {columns,total:rows * columns};
}
function enableGridPainting(grid) {
  let stroke;
  function paint(input) {
    if (!input || input.checked === stroke.checked) return;
    input.checked = stroke.checked;
    input.dispatchEvent(new Event('input',{bubbles:true}));
  }
  grid.addEventListener('pointerdown', event => {
    if (stroke || event.button !== 0 || !event.target.matches('input[type="checkbox"]')) return;
    event.preventDefault();
    stroke = {id:event.pointerId,checked:!event.target.checked,x:event.clientX,y:event.clientY};
    grid.setPointerCapture(event.pointerId);
    paint(event.target);
  });
  grid.addEventListener('pointermove', event => {
    if (stroke?.id !== event.pointerId) return;
    const dx = event.clientX - stroke.x, dy = event.clientY - stroke.y;
    const samples = Math.max(1,Math.ceil(Math.hypot(dx,dy) / 7));
    for (let i = 1; i <= samples; i++) {
      const cell = document.elementFromPoint(stroke.x + dx * i / samples, stroke.y + dy * i / samples);
      if (cell?.parentElement === grid && cell.matches('input[type="checkbox"]')) paint(cell);
    }
    stroke.x = event.clientX;
    stroke.y = event.clientY;
  });
  grid.addEventListener('lostpointercapture', event => {
    if (stroke?.id === event.pointerId) stroke = undefined;
  });
  grid.addEventListener('click', event => {
    if (event.detail > 0 && event.target.matches('input[type="checkbox"]')) event.preventDefault();
  });
}
function normalize(value) {
  const text = String(value).trim().toLocaleLowerCase('cs').replace(/\s+/g,' ');
  const number = text.replace(/^x\s*=\s*/,'').replace('−','-').replace(',','.');
  return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(number) ? String(Number(number)) : text;
}
function isCorrect(question,value) {
  if (question.type === 'choice') return value === String(question.correct);
  if (question.grid) {
    const {total} = gridShape(question);
    const selected = new Set((value || '').split(',').filter(cell => /^\d{1,2}$/.test(cell) && Number(cell) < total));
    return question.answers.some(answer => Number(answer) === selected.size);
  }
  if (question.parts) {
    const actual = (value || '').split('|').map(normalize).join('|');
    return question.answers.some(answer => String(answer).split('|').map(normalize).join('|') === actual);
  }
  return question.answers.some(answer => normalize(answer) === normalize(value ?? ''));
}

function addDailyFields(question,index){
    const field = document.createElement('fieldset');
    field.className = 'question';
    const legend = document.createElement('legend');
    legend.textContent = (index+1) + '. ' + question.prompt;
    field.append(legend);
    const sideLayout = false && question.type === 'choice' && question.image;
    const content = sideLayout ? document.createElement('div') : field;
    if (sideLayout) {
      content.className = 'question-side';
      field.append(content);
    }
    const diagram = question.hotspots ? document.createElement('div') : content;
    if (diagram !== content) {
      diagram.className = 'diagram-hotspots';
      content.append(diagram);
    }
    if (question.image && /^data:image\/(png|jpeg|webp|gif|svg\+xml);base64,/i.test(question.image)) {
      const image = document.createElement('img');
      image.className = 'question-image';
      image.src = question.image;
      image.alt = question.imageAlt || 'Obrázek k úloze';
      diagram.append(image);
    }
    const draft = '';
    if (question.type === 'choice') {
      const options = document.createElement('div');
      options.className = 'options';
      question.options.forEach((option,i) => {
        const label = document.createElement('label');
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'answer-' + index;
        radio.value = i;
        radio.checked = draft === String(i);
        radio.required = true;
        if (question.hotspots) {
          const [x,y] = question.hotspots[i];
          label.style.left = x + '%';
          label.style.top = y + '%';
          radio.setAttribute('aria-label',option);
          const number = document.createElement('span');
          number.textContent = i + 1;
          label.append(radio,number);
          diagram.append(label);
        } else {
          label.append(radio, String.fromCharCode(65+i) + ') ' + option);
          options.append(label);
        }
      });
      if (sideLayout) content.prepend(options);
      else if (!question.hotspots) field.append(options);
    } else if (question.grid) {
      const grid = document.createElement('div');
      grid.className = 'percent-grid';
      const {columns,total} = gridShape(question);
      grid.style.setProperty('--grid-columns',columns);
      const marked = new Set((draft || '').split(','));
      const count = document.createElement('p');
      count.className = 'percent-grid-count';
      count.setAttribute('aria-live','polite');
      const updateCount = () => {
        count.textContent = 'Vybarveno: ' + grid.querySelectorAll('input:checked').length + ' z ' + total;
      };
      for (let cell = 0; cell < total; cell++) {
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.name = 'answer-' + index;
        input.value = String(cell);
        input.checked = marked.has(input.value);
        input.setAttribute('aria-label','Řádek ' + (Math.floor(cell / columns) + 1) + ', sloupec ' + (cell % columns + 1));
        grid.append(input);
      }
      grid.addEventListener('input',updateCount);
      enableGridPainting(grid);
      field.append(grid,count);
      updateCount();
    } else if (question.parts) {
      const parts = document.createElement('div');
      parts.className = question.fractionLayout ? 'fraction-equation' : 'percent-parts';
      const saved = (draft || '').split('|');
      const inputs = question.parts.map((caption, part) => {
        const input = document.createElement('input');
        input.name = 'answer-' + index;
        input.inputMode = question.fractionLayout && part < 2 ? 'numeric' : 'decimal';
        input.autocomplete = 'off';
        input.required = true;
        input.value = saved[part] ?? '';
        input.setAttribute('aria-label',caption);
        return input;
      });
      if (question.fractionLayout && inputs.length === 4) {
        const element = (className, text = '') => {
          const span = document.createElement('span');
          span.className = className;
          span.textContent = text;
          return span;
        };
        const first = element('fraction');
        first.append(inputs[0],inputs[1]);
        const hundredths = element('fraction');
        hundredths.append(inputs[2],element('fraction-fixed','100'));
        const percentage = element('fraction-percent');
        percentage.append(inputs[3],element('fraction-sign','%'));
        parts.append(first,element('fraction-sign','='),hundredths,element('fraction-sign','='),percentage);
      } else {
        inputs.forEach((input, part) => {
          const label = document.createElement('label');
          label.textContent = question.parts[part];
          label.append(input);
          parts.append(label);
        });
      }
      field.append(parts);
    } else {
      const input = document.createElement('input');
      input.name = 'answer-' + index;
      input.value = draft ?? '';
      input.required = true;
      input.autocomplete = 'off';
      input.setAttribute('aria-label','Odpověď na otázku ' + (index+1));
      field.append(input);
    }
$('dailyFields').append(field);
}
